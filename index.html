:root {
  --bg: #040302;
  --film: rgba(20, 16, 12, 0.92);
  --line: rgba(241, 234, 222, 0.14);
  --text: #f1eade;
  --muted: rgba(241, 234, 222, 0.7);
  --faint: rgba(241, 234, 222, 0.42);
  --accent: #e9b24c;
  --serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --gutter: clamp(16px, 3vw, 40px);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  /* 胶片尺寸：画格 4:3，上下片边各 --rail */
  --cell-w: clamp(92px, 9vw, 132px);
  --cell-h: calc(var(--cell-w) * 0.75);
  --cell-gap: 8px;
  --rail: 22px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--bg); color: var(--text);
  font: 15px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
img { display: block; }
h1, h2, p, ol { margin: 0; }
ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* 3D 场景铺满整个视口，界面浮在上面 */
.scene { position: fixed; inset: 0; touch-action: none; -webkit-tap-highlight-color: transparent; }
.scene canvas { display: block; width: 100%; height: 100%; opacity: 0; transition: opacity .9s ease; }
.is-ready .scene canvas { opacity: 1; }
/* 预映：3D 还在下载时，用当前封面铺一层虚化背景，打开页面立刻有画面 */
.preshow {
  position: fixed; inset: -6%; background: #040302 center / cover no-repeat;
  filter: blur(30px) brightness(0.3) saturate(1.1);
  transition: opacity 1s ease;
}
.is-ready .preshow { opacity: 0; pointer-events: none; }
.is-warming .hud-play { animation: warming 1s ease-in-out infinite; }
@keyframes warming { 50% { box-shadow: 0 0 0 8px rgba(233, 178, 76, 0.18); } }
.no-webgl .scene { background: #000 center / contain no-repeat; filter: brightness(.7); }
.vignette {
  position: fixed; inset: 0; pointer-events: none;
  background:
    linear-gradient(to top, rgba(4, 3, 2, 0.92), rgba(4, 3, 2, 0.5) 22%, transparent 42%),
    linear-gradient(to bottom, rgba(4, 3, 2, 0.7), transparent 16%);
  transition: opacity .8s;
}

/* 界面在推进 / 放映时淡出 */
.top, .hud, .reel { transition: opacity .6s var(--ease), transform .6s var(--ease); }
.is-flying :is(.top, .hud, .reel), .is-playing :is(.top, .hud, .reel) { opacity: 0; pointer-events: none; }
.is-flying .hud, .is-playing .hud { transform: translateY(12px); }
.is-flying .reel, .is-playing .reel { transform: translateY(24px); }
.is-playing .vignette, .is-flying .vignette { opacity: 0; }

/* 顶栏 */
.top {
  position: fixed; z-index: 5; top: 0; left: 0; right: 0;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px 24px;
  padding: 16px var(--gutter) 12px;
}
.mark { font-size: 15px; font-weight: 600; letter-spacing: 0.08em; white-space: nowrap; }
.mark-sub { margin-left: 10px; font-weight: 400; color: var(--faint); letter-spacing: 0.12em; font-size: 13px; }
.top-right { justify-self: end; display: flex; align-items: center; gap: 14px; }
.top-mail { font-size: 13px; color: var(--muted); text-decoration: none; transition: color .2s; }
.lang {
  min-width: 38px; height: 30px; padding: 0 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: rgba(10, 8, 6, 0.55); font-size: 12px; letter-spacing: 0.08em;
  transition: border-color .2s, color .2s;
}
.lang:hover { border-color: var(--accent); color: var(--accent); }
.top-mail:hover { color: var(--text); }
.chips { display: flex; gap: 6px; }
.chip {
  display: inline-flex; align-items: baseline; gap: 6px; flex: none;
  padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line);
  background: rgba(10, 8, 6, 0.45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  font-size: 13px; text-decoration: none; color: var(--muted);
  transition: color .2s, border-color .2s, background .2s;
}
.chip small { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.chip:hover { color: var(--text); border-color: rgba(241, 234, 222, 0.3); }
.chip[aria-current="true"] { color: #1a1408; background: var(--accent); border-color: var(--accent); }
.chip[aria-current="true"] small { color: rgba(26, 20, 8, 0.6); }

/* 片名信息 */
.hud {
  position: fixed; z-index: 5; left: var(--gutter);
  bottom: calc(var(--cell-h) + var(--rail) * 2 + 64px + env(safe-area-inset-bottom));
  max-width: min(520px, 46vw);
  text-shadow: 0 2px 18px rgba(0, 0, 0, 0.7);
}
.hud.swap > * { animation: hud-in .7s var(--ease) both; }
.hud.swap > :nth-child(2) { animation-delay: .04s; }
.hud.swap > :nth-child(3) { animation-delay: .08s; }
@keyframes hud-in { from { opacity: 0; transform: translateY(10px); } }
.hud-count { font: 12px var(--mono); color: var(--faint); letter-spacing: 0.08em; }
.hud-num { color: var(--accent); }
.hud-title {
  font-family: var(--serif); font-weight: 600; letter-spacing: 0.03em;
  font-size: clamp(30px, 4.4vw, 60px); line-height: 1.1; margin-top: 6px;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
}
.hud-title.is-long { font-size: clamp(22px, 2.6vw, 36px); line-height: 1.2; }
.hud-cat { margin-top: 8px; font-size: 14px; color: var(--accent); letter-spacing: 0.1em; }
.hud-actions { display: flex; align-items: center; gap: 18px; margin-top: 18px; }
.hud-play {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  padding: 9px 18px 9px 14px; border-radius: 999px; border: 1px solid rgba(233, 178, 76, 0.7);
  background: rgba(233, 178, 76, 0.12); color: var(--text); font-size: 14px; letter-spacing: 0.12em;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transition: background .25s, color .25s, transform .25s var(--ease);
}
.hud-play svg { width: 14px; height: 14px; fill: currentColor; }
.hud-play:hover { background: var(--accent); color: #1a1408; }
.hud-play:active { transform: scale(.97); }
.hud-out { font-size: 12px; color: var(--faint); text-decoration: none; transition: color .2s; }
.hud-out:hover { color: var(--text); }

/* 播放器盖在银幕上 */
.player {
  position: fixed; z-index: 8; left: 0; top: 0; width: 0; height: 0;
  background: #000; opacity: 0; pointer-events: none;
  box-shadow: 0 0 120px rgba(233, 178, 76, 0.18);
  transition: opacity .7s ease;
}
.player iframe { display: block; width: 100%; height: 100%; border: 0; }
.is-playing .player { pointer-events: auto; }
.is-playing.player-ready .player { opacity: 1; }
.stop {
  position: fixed; z-index: 9; top: calc(14px + env(safe-area-inset-top)); right: var(--gutter);
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 10px 8px 16px; border-radius: 999px; cursor: pointer;
  background: rgba(10, 8, 6, 0.72); border: 1px solid var(--line); font-size: 13px; letter-spacing: 0.06em;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  opacity: 0; pointer-events: none; transform: translateY(-6px); transition: opacity .4s, transform .4s var(--ease);
}
.is-playing .stop { opacity: 1; pointer-events: auto; transform: none; }
.stop:hover { border-color: rgba(241, 234, 222, 0.4); }
.stop kbd { font: 11px var(--mono); color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }

.tip {
  position: fixed; z-index: 9; left: 0; top: 0; pointer-events: none;
  padding: 4px 10px; border-radius: 999px; font-size: 12px; letter-spacing: 0.1em;
  background: var(--accent); color: #1a1408; font-weight: 600;
}
.tip[hidden] { display: none; }

/* mp4 控制条 */
.controls {
  position: fixed; z-index: 9; display: flex; align-items: center; gap: 10px;
  height: 40px; padding: 0 12px; border-radius: 999px;
  background: rgba(10, 8, 6, 0.78); border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums;
  transition: opacity .4s, transform .4s var(--ease);
}
.controls[hidden] { display: none; }
.controls.is-idle { opacity: 0; transform: translateY(6px); pointer-events: none; }
.controls button {
  display: grid; place-items: center; width: 28px; height: 28px; padding: 0; flex: none;
  border: 0; border-radius: 50%; background: none; cursor: pointer; color: var(--text);
}
.controls button:hover { color: var(--accent); }
.controls svg { width: 18px; height: 18px; fill: currentColor; stroke: currentColor; stroke-width: 0; }
.ctl-mute svg, .ctl-full svg { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ctl-mute svg path:first-child { fill: currentColor; stroke: none; }
.controls .i-play, .controls.is-paused .i-pause, .controls .i-x, .controls.is-muted .i-wave { display: none; }
.controls.is-paused .i-play, .controls.is-muted .i-x { display: inline; }
.ctl-seek { flex: 1; min-width: 60px; accent-color: var(--accent); height: 4px; cursor: pointer; }
.sound {
  position: fixed; z-index: 9; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  padding: 10px 18px; border-radius: 999px; border: 0; cursor: pointer;
  background: var(--accent); color: #1a1408; font-weight: 600; letter-spacing: 0.06em;
}
.sound[hidden] { display: none; }
/* 投放用的 <video> 不直接显示（画面在 3D 银幕上），只在平面模式时出现 */
.film { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.film.film-flat {
  z-index: 8; left: 50%; top: 50%; width: min(94vw, 84vh * 1.78); height: auto; max-height: 84vh;
  transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; background: #000;
}
.is-film .player { display: none; }
.noscript { position: relative; z-index: 10; padding: 80px 24px; line-height: 2; }

/* 胶片 */
.reel {
  position: fixed; z-index: 5; left: 0; right: 0; bottom: 0;
  user-select: none; -webkit-user-select: none;
}
.strip {
  overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
  scroll-snap-type: x mandatory; overscroll-behavior-x: contain;
  padding-inline: calc(50% - (var(--cell-w) + var(--cell-gap)) / 2);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
  cursor: grab;
}
.strip::-webkit-scrollbar { display: none; }
.strip.is-dragging { cursor: grabbing; scroll-snap-type: none; }
.frames {
  position: relative; display: flex; width: max-content;
  padding-block: var(--rail); background: var(--film);
}
/* 齿孔 */
.frames::before, .frames::after {
  content: ""; position: absolute; left: 0; right: 0; height: 7px; opacity: 0.75;
  background: repeating-linear-gradient(90deg, transparent 0 6px, rgba(241, 234, 222, 0.75) 6px 16px, transparent 16px 22px);
}
.frames::before { top: 5px; }
.frames::after { bottom: 5px; }

.frame { position: relative; flex: none; padding: 0 calc(var(--cell-gap) / 2); scroll-snap-align: center; }
.frame-link {
  position: relative; display: block; width: var(--cell-w); height: var(--cell-h);
  overflow: hidden; border-radius: 2px; background: #000;
}
.frame-link img {
  width: 100%; height: 100%; object-fit: cover; pointer-events: none;
  filter: brightness(0.45) saturate(0.55) sepia(0.15);
  transition: filter .35s;
}
.frame-link:hover img { filter: brightness(0.8) saturate(0.85); }
.frame-link[aria-current="true"] img { filter: none; }
.frame-num {
  position: absolute; left: calc(var(--cell-gap) / 2); bottom: calc(-1 * var(--rail) + 12px);
  font: 9px/1 var(--mono); color: rgba(233, 178, 76, 0.6); letter-spacing: 0.1em;
}
.frame-num::before { content: "▸ "; }

/* 片头卡：分类之间的引导片 */
.leader {
  flex: none; width: calc(var(--cell-w) * 0.86); padding: 0 6px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  text-align: center;
}
.leader-mark {
  width: calc(var(--cell-h) * 0.32); aspect-ratio: 1; border-radius: 50%;
  border: 1px solid rgba(233, 178, 76, 0.55); margin-bottom: 3px;
  background:
    linear-gradient(rgba(233, 178, 76, 0.45), rgba(233, 178, 76, 0.45)) center / 1px 100% no-repeat,
    linear-gradient(rgba(233, 178, 76, 0.45), rgba(233, 178, 76, 0.45)) center / 100% 1px no-repeat;
}
.leader-name { font-size: 12px; color: var(--accent); white-space: nowrap; }
.leader-alt { font: 7px/1.2 var(--mono); color: var(--faint); letter-spacing: 0.12em; text-transform: uppercase; }
.frame-blank {
  display: grid; place-items: center; width: 100%; height: 100%; padding: 6px; text-align: center;
  font: 600 11px/1.3 var(--serif); color: var(--muted); background: radial-gradient(circle, #2c251e, #0e0b09);
}

/* 片门 */
.gate {
  position: absolute; left: 50%; top: calc(var(--rail) - 4px); pointer-events: none;
  width: calc(var(--cell-w) + 8px); height: calc(var(--cell-h) + 8px); transform: translateX(-50%);
  border: 1.5px solid var(--accent); border-radius: 4px;
  box-shadow: 0 0 22px rgba(233, 178, 76, 0.4), inset 0 0 14px rgba(233, 178, 76, 0.2);
}

.reel-step {
  position: absolute; z-index: 2; top: calc(var(--rail) + var(--cell-h) / 2 - 18px);
  width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
  display: grid; place-items: center;
  background: rgba(20, 16, 12, 0.9); border: 1px solid var(--line);
  transition: border-color .2s, opacity .2s;
}
.reel-step:hover { border-color: var(--accent); }
.reel-step:disabled { opacity: 0.3; cursor: default; border-color: var(--line); }
.reel-step svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.reel-prev { left: var(--gutter); }
.reel-next { right: var(--gutter); }
.hint-touch { display: none; }
@media (hover: none) {
  .reel-step, .hint-mouse { display: none; }
  .hint-touch { display: inline; }
  .strip { cursor: auto; }
  /* 毛玻璃叠在持续刷新的 3D 画面上，手机每帧都要重算模糊，换成实色半透明 */
  .chip, .hud-play, .stop, .controls { backdrop-filter: none; -webkit-backdrop-filter: none; }
  .controls { background: rgba(10, 8, 6, 0.9); height: 44px; }
  .chip { background: rgba(10, 8, 6, 0.78); }
  .hud-play { background: rgba(40, 30, 14, 0.85); min-height: 44px; padding-inline: 16px 22px; }
  .stop { background: rgba(10, 8, 6, 0.9); min-height: 40px; }
  .frame-link, .chip, .hud-play { -webkit-tap-highlight-color: transparent; }
}
.reel-hint {
  text-align: center; font-size: 12px; color: var(--faint); letter-spacing: 0.06em;
  padding: 8px var(--gutter) calc(12px + env(safe-area-inset-bottom));
}

@media (max-width: 760px) {
  .top { grid-template-columns: 1fr auto; padding-bottom: 10px; }
  .chips {
    grid-row: 2; grid-column: 1 / -1; overflow-x: auto; scrollbar-width: none;
    margin: 0 calc(-1 * var(--gutter)); padding: 0 var(--gutter);
  }
  .chips::-webkit-scrollbar { display: none; }
  .top-mail { font-size: 12px; }
  .top-mail { max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hud { max-width: none; right: var(--gutter); bottom: calc(var(--cell-h) + var(--rail) * 2 + 48px + env(safe-area-inset-bottom)); }
  .hud-title { font-size: 30px; }
  .hud-actions { margin-top: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

.quiet,.remove{background:transparent;border:0;color:#d7c9ae;padding:8px 0}
.editor-body{padding:18px 24px 12px;overflow:auto;overscroll-behavior:contain;min-height:0}

.primary{border-color:#e9b24c;background:#e9b24c;color:#171207;font-weight:650}
.editor-actions{display:flex;justify-content:space-between;gap:8px}.editor-foot{border-top:1px solid #3b3730}.editor-foot p:not(:empty){margin:0 0 9px}.editor-foot p:empty{display:none}
#notice{position:fixed;z-index:12;bottom:16px;left:50%;transform:translateX(-50%);padding:12px 18px;border:1px solid #927e56;background:#211f19;color:#f5ead3;border-radius:8px;font-size:15px;max-width:92vw;min-width:min(360px,88vw);text-align:center}
#editor button:disabled{opacity:.45;cursor:default}.top{grid-template-columns:minmax(0,1fr) minmax(0,auto) auto}.mark{overflow:hidden;text-overflow:ellipsis}.chips{max-width:46vw;overflow:auto}.top-right{min-width:0}
.hud{max-width:min(46vw,560px)}.hud-title{overflow-wrap:anywhere}
@media(max-width:760px){.hud{max-width:none}.top{grid-template-columns:minmax(0,1fr) auto}.chips{max-width:100vw}.editor-head,.editor-foot,.editor-body{padding:14px 16px}.mark-sub{font-size:12px}.hud-description{max-height:3.25em;max-width:32ch}}
@media(max-width:440px){.two-col{grid-template-columns:1fr;gap:0}.mark-sub{display:none}}
@media(max-height:580px) and (orientation:landscape){.hud-title{font-size:26px}.hud-description{max-height:2.6em}.hud-actions{margin-top:6px}:root{--cell-h:44px;--rail:13px}}

html, body { height:auto; min-height:100%; }
body { overflow:visible; overflow-x:clip; }
html.is-flying, html.is-playing, html:has(dialog[open]) { overflow:hidden; }
.screening-stage { height:100vh; height:100svh; position:relative; overflow:hidden; isolation:isolate; }
.screening-stage :is(.preshow,.scene,.vignette,.top,.hud,.reel) { position:absolute; }
.screening-stage .scene, .screening-stage .scene canvas { touch-action:pan-y pinch-zoom; }
.screening-stage .hud-description { display:none; }
.reel-hint { display:flex; align-items:center; justify-content:center; gap:1.1em; }
.intro-jump,.booth-link { background:none; border:0; color:#e3c390; font:inherit; cursor:pointer; }
.intro-jump { display:inline-flex; align-items:center; gap:.6em; border-left:1px solid #695436; padding:2px 0 2px 1.1em; }
.intro-jump::after { content:""; width:6px; height:6px; transform:translateY(-2px) rotate(45deg); border:solid currentColor; border-width:0 1px 1px 0; }
.programme { position:relative; color:var(--text); background:radial-gradient(ellipse at 20% 0%,#231c14 0,transparent 54%),#100f0d; border-top:1px solid #54442e; padding:clamp(44px,6vw,94px) var(--gutter) clamp(56px,8vw,116px); }
.programme-inner { max-width:1112px; margin:auto; }
.programme-head { display:flex; align-items:center; justify-content:space-between; gap:16px; margin:0 0 clamp(27px,4vw,54px); }
.programme-head h2 { font:500 clamp(29px,4.1vw,56px)/1.25 var(--serif); letter-spacing:.055em; }
.booth-link { font-size:14px; padding:7px 0; border-bottom:1px solid #665134; }
.film-note { border-top:1px solid #4b4030; padding-block:clamp(28px,4.6vw,62px); display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:clamp(26px,6.5vw,92px); align-items:center; }
.film-note:last-child { border-bottom:1px solid #4b4030; }
.film-still { position:relative; aspect-ratio:16/9; box-sizing:content-box; padding-block:13px; background:#080807; border:1px solid #40382c; display:grid; place-items:center; }
.film-still::before,.film-still::after { content:""; position:absolute; left:5px; right:5px; height:4px; opacity:.67; background:repeating-linear-gradient(90deg,#84745b 0 7px,transparent 7px 18px); }
.film-still::before { top:4px; }.film-still::after { bottom:4px; }
.film-still img { width:100%; height:100%; min-height:0; object-fit:contain; }
.still-title { font:500 24px var(--serif); color:var(--muted); }
.film-meta { margin:0 0 12px; color:#d8ae69; font-size:14px; letter-spacing:.16em; }
.film-heading { font:500 clamp(26px,3.1vw,46px)/1.25 var(--serif); margin:0; overflow-wrap:anywhere; }
.film-synopsis { margin:17px 0 0; color:#d6cdbc; white-space:pre-line; overflow-wrap:anywhere; line-height:1.9; font-size:clamp(16px,1.3vw,18px); }
.film-watch { display:inline-flex; align-items:center; gap:8px; margin-top:22px; border:1px solid #927140; background:#231d14; color:#f2d9a7; border-radius:30px; padding:8px 17px; cursor:pointer; font:14px var(--sans); }
.film-watch::before { content:""; width:0;height:0;border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent; }
.film-watch:hover,.intro-jump:hover,.booth-link:hover { color:#ffdead; }
@media(max-width:700px){.film-note{grid-template-columns:minmax(0,1fr);gap:23px}.programme{padding-inline:clamp(20px,5vw,36px)}}

.flat-frame[hidden],.film-leader[hidden],.flat-cover:not([src]) { display:none; }
.no-webgl .scene { filter:none; background:#080705; }
.flat-frame { position:absolute; top:50%; left:50%; width:min(100%,177.78vh); aspect-ratio:16/9; transform:translate(-50%,-50%); }

</style></head><body><template id="scene-shell"><div class="screening-stage" id="screening-stage">
  <div class="preshow" aria-hidden="true"></div>
  <div class="scene" aria-hidden="true">
    <div class="flat-frame" hidden>
      <div class="flat-booth">
        <div class="flat-screen"><img class="flat-cover" alt=""><div class="film-leader" hidden><span></span></div></div>
        <div class="flat-projector"></div>
      </div>
    </div>
  </div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="top">
    <h1 class="mark"><span data-site="name"></span><span class="mark-sub" data-site="tagline"></span></h1>
    <nav class="chips" aria-label="" data-i18n-label="categories"></nav>
    <div class="top-right"><button type="button" id="edit-open">编辑作品集</button></div>
  </header>

  <main class="hud" aria-live="polite">
    <p class="hud-count"><span class="hud-num"></span> / <span id="film-total"></span></p>
    <h2 class="hud-title"></h2>
    <p class="hud-cat"></p><p class="hud-description"></p>
    <div class="hud-actions">
      <button class="hud-play" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg><span data-i18n="play"></span></button>
      <a class="hud-out" target="_blank" rel="noopener"></a>
    </div>
  </main>

  <section class="reel" aria-label="">
    <button class="reel-step reel-prev" type="button" aria-label=""><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="strip">
      <ol class="frames" role="list">
      </ol>
    </div>
    <span class="gate" aria-hidden="true"></span>
    <button class="reel-step reel-next" type="button" aria-label=""><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    <p class="reel-hint"><span class="hint-mouse" data-i18n="hintMouse"></span><span class="hint-touch" data-i18n="hintTouch"></span><button class="intro-jump" id="read-intro" type="button">下滑看作品简介</button></p>
  </section>
  </div>
  <section class="programme" aria-labelledby="programme-title">
    <div class="programme-inner">
      <header class="programme-head"><h2 id="programme-title" tabindex="-1">作品简介</h2><button type="button" class="booth-link">回到放映厅</button></header>
      <div class="programme-films"></div>
    </div>
  </section>

  <div class="player"><iframe allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
  <div class="controls" hidden>
    <button class="ctl-toggle" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-pause" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/><path class="i-play" d="M8 5.5v13l11-6.5z"/></svg></button>
    <span class="ctl-time">0:00</span>
    <input class="ctl-seek" type="range" min="0" max="1000" value="0" step="1">
    <span class="ctl-dur">0:00</span>
    <button class="ctl-mute" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="i-wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="i-x" d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></svg></button>
    <button class="ctl-full" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
  </div>
  <button class="sound" type="button" hidden data-i18n="tapForSound"></button>
  <button class="stop" type="button"><span data-i18n="back"></span><kbd>Esc</kbd></button>
  <p class="tip" hidden></p>
<dialog id="editor" aria-labelledby="editor-title">
  <form id="edit-form" autocomplete="off">
    <header class="editor-head"><div><h2 id="editor-title">编辑作品集</h2><p id="save-location"></p></div><button type="button" class="quiet" id="dismiss">关闭</button></header>
    <div class="editor-body">
      <fieldset><legend>放映厅</legend><div class="two-col"><label>名称<input id="site-name" required maxlength="48"></label><label>副标题<input id="site-tagline" maxlength="60"></label></div></fieldset>
      <fieldset><legend>作品</legend>
        <div class="film-select"><label>选择要编辑的作品<select id="film-picker"></select></label><button type="button" class="secondary" id="new-film">添加作品</button></div>
        <div class="two-col"><label>片名<input id="film-title" required maxlength="100"></label><label>分类<input id="film-category" required maxlength="24"></label></div>
        <label>作品介绍<textarea id="film-description" rows="3" maxlength="1400" placeholder="写下故事、创作想法或你负责的部分"></textarea></label>
        <label>视频文件<input id="film-file" type="file" accept="video/mp4,video/webm,video/quicktime,.mp4,.m4v,.webm,.mov"></label>
        <p class="file-note" id="file-note"></p>
        <label>封面图片 <span>可选</span><input id="poster-file" type="file" accept="image/jpeg,image/png,image/webp"></label>
        <p class="file-note" id="poster-note"></p>
        <button type="button" class="remove" id="delete-film">移除此作品</button>
      </fieldset>
    </div>
    <footer class="editor-foot"><p role="status" id="edit-status"></p><div class="editor-actions"><button type="button" class="secondary" id="export">导出观看版</button><button type="submit" class="primary" id="save">保存并返回</button></div></footer>
  </form>
